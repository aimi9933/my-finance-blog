{{ define "main" }}
<section class="bg-gray-50 py-16">
    <div class="container mx-auto px-6 max-w-4xl">
        <h1 class="text-4xl font-serif font-bold text-gray-900 mb-12 text-center capitalize">
            {{ .Title }}
        </h1>

        <div class="flex flex-wrap justify-center gap-4">
            {{ range .Data.Terms }}
            <a href="{{ .Page.RelPermalink }}"
                class="px-6 py-3 bg-white rounded shadow-sm hover:shadow-md text-gray-700 font-semibold hover:text-trust-blue transition-all border border-gray-200">
                #{{ .Page.Title }} <span class="text-gray-400 text-sm ml-1">({{ .Count }})</span>
            </a>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
